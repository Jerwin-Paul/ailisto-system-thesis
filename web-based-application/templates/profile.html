{% extends "_layout.html" %} {% block title %}Profile - Ai-Listo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div>
    <h2 class="page-title">Profile</h2>
    <p class="page-subtitle">Manage your account information.</p>
  </div>

  <div style="max-width: 640px">
    <div class="card">
      <div class="card-content space-y-6">
        <!-- Avatar -->
        <div style="display: flex; align-items: center; gap: 1.5rem">
          <div
            style="
              width: 80px;
              height: 80px;
              border-radius: 50%;
              background: var(--border-light);
              border: 2px solid var(--border);
              display: flex;
              align-items: center;
              justify-content: center;
              color: var(--text-400);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <div>
            <h3 id="profile-display-name" style="font-size: 1.25rem">
              {{ user.first_name }} {{ user.last_name }}
            </h3>
            <p id="profile-display-email" class="text-sm" style="color: var(--text-500)">
              {{ user.email }}
            </p>
          </div>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border-light)" />

        <!-- Profile form -->
        <form id="profile-form" class="space-y-4">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="prof-first">First Name</label>
              <input
                class="form-input"
                type="text"
                id="prof-first"
                value="{{ user.first_name }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="prof-last">Last Name</label>
              <input
                class="form-input"
                type="text"
                id="prof-last"
                value="{{ user.last_name }}"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="prof-email">Email</label>
            <input
              class="form-input"
              type="email"
              id="prof-email"
              value="{{ user.email }}"
            />
          </div>
          <p id="profile-save-msg" class="text-sm" style="display: none"></p>
          <div
            style="
              display: flex;
              gap: 0.75rem;
              flex-wrap: wrap;
              margin-top: 2rem;
            "
          >
            <button id="profile-save-btn" type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/forgot-password?from=profile" class="btn btn-outline"
              >Change Password</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    const form = document.getElementById("profile-form");
    const firstInput = document.getElementById("prof-first");
    const lastInput = document.getElementById("prof-last");
    const emailInput = document.getElementById("prof-email");
    const saveBtn = document.getElementById("profile-save-btn");
    const messageEl = document.getElementById("profile-save-msg");
    const displayName = document.getElementById("profile-display-name");
    const displayEmail = document.getElementById("profile-display-email");
    const saveBtnDefaultHtml = saveBtn.innerHTML;
    let messageHideTimer = null;

    function setSavingState(isSaving) {
      saveBtn.disabled = isSaving;
      saveBtn.style.opacity = isSaving ? "0.85" : "1";
      saveBtn.style.cursor = isSaving ? "wait" : "pointer";
      saveBtn.innerHTML = isSaving
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:0.5rem; vertical-align:middle;"><circle cx="12" cy="12" r="9" opacity="0.25"/><path d="M21 12a9 9 0 0 1-9 9"><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></path></svg>Saving...'
        : saveBtnDefaultHtml;
    }

    function showMessage(text, isError) {
      if (messageHideTimer) {
        clearTimeout(messageHideTimer);
        messageHideTimer = null;
      }
      messageEl.textContent = text;
      messageEl.style.display = "block";
      messageEl.style.color = isError ? "var(--red-600)" : "var(--emerald-600)";
      if (!isError) {
        messageHideTimer = setTimeout(function () {
          messageEl.style.display = "none";
        }, 3500);
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const payload = {
        firstName: firstInput.value.trim(),
        lastName: lastInput.value.trim(),
        email: emailInput.value.trim(),
      };

      setSavingState(true);

      try {
        const resp = await fetch("/api/profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(payload),
        });

        const raw = await resp.text();
        let data = {};
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch (_) {
          data = {};
        }

        if (!resp.ok) {
          const fallback = raw
            ? "Request failed (" + resp.status + "): " + raw.slice(0, 240)
            : "Request failed (" + resp.status + ").";
          throw new Error(data.error || fallback || "Could not save profile.");
        }

        const updated = data.user || {};
        firstInput.value = updated.first_name || payload.firstName;
        lastInput.value = updated.last_name || payload.lastName;
        emailInput.value = updated.email || payload.email;
        displayName.textContent =
          (updated.first_name || payload.firstName) + " " + (updated.last_name || payload.lastName);
        displayEmail.textContent = updated.email || payload.email;
        showMessage("Profile saved successfully.", false);
      } catch (err) {
        const msg = err && err.message ? err.message : "Could not save profile.";
        showMessage(msg, true);
      } finally {
        setSavingState(false);
      }
    });
  })();
</script>
{% endblock %}
