{% extends "_layout.html" %} {% block title %}Profile - Ai-Listo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div>
    <h2 class="page-title">Profile</h2>
    <p class="page-subtitle">Manage your account information.</p>
  </div>

  <div style="max-width: 640px">
    <div class="card">
      <div class="card-content space-y-6">
        <!-- Avatar -->
        <div style="display: flex; align-items: center; gap: 1.5rem">
          <div
            style="
              width: 80px;
              height: 80px;
              border-radius: 50%;
              background: var(--border-light);
              border: 2px solid var(--border);
              display: flex;
              align-items: center;
              justify-content: center;
              color: var(--text-400);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <div>
            <h3 style="font-size: 1.25rem">Teacher Name</h3>
            <p class="text-sm" style="color: var(--text-500)">
              teacher@school.com
            </p>
          </div>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border-light)" />

        <!-- Profile form -->
        <form class="space-y-4">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="prof-first">First Name</label>
              <input
                class="form-input"
                type="text"
                id="prof-first"
                value="Teacher"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="prof-last">Last Name</label>
              <input
                class="form-input"
                type="text"
                id="prof-last"
                value="Name"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="prof-email">Email</label>
            <input
              class="form-input"
              type="email"
              id="prof-email"
              value="teacher@school.com"
            />
          </div>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/forgot-password?from=profile" class="btn btn-outline">Change Password</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
