<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create Account - Ai-Listo</title>
    <meta name="description" content="Create an Ai-Listo account." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/design.css') }}"
    />
    <style>
      .toast {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 200;
        min-width: 320px;
        max-width: 420px;
        padding: 1rem 1.25rem;
        border-radius: var(--radius-xl);
        font-size: 0.875rem;
        font-weight: 500;
        font-family: var(--font-body);
        box-shadow: var(--shadow-xl);
        transform: translateX(120%);
        opacity: 0;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .toast.show {
        transform: translateX(0);
        opacity: 1;
      }
      .toast-error {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .toast-success {
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .toast svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .toast-error svg {
        color: #dc2626;
      }
      .toast-success svg {
        color: #059669;
      }
      .field-error {
        font-size: 0.75rem;
        color: var(--red-500);
        margin-top: 0.375rem;
        display: none;
        align-items: center;
        gap: 0.25rem;
      }
      .field-error.show {
        display: flex;
      }
      .form-input.input-error {
        border-color: var(--red-500);
        background: #fef2f2;
      }
      .form-input.input-error:focus {
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        border-color: var(--red-500);
      }
      .btn-loading {
        pointer-events: none;
        opacity: 0.7;
      }
      .btn-loading .btn-spinner {
        display: inline-block;
      }
      .btn-spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      .strength-meter {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .strength-bar {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--border, #e5e7eb);
        transition: background 0.3s;
      }
      .strength-label {
        font-size: 0.72rem;
        margin-top: 4px;
        color: var(--text-secondary, #6b7280);
      }
    </style>
  </head>
  <body>
    <!-- Toast notification -->
    <div class="toast" id="toast">
      <svg
        id="toast-icon-error"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="display: none"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="15" y1="9" x2="9" y2="15" />
        <line x1="9" y1="9" x2="15" y2="15" />
      </svg>
      <svg
        id="toast-icon-success"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="display: none"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <span id="toast-msg"></span>
    </div>

    <div class="auth-centered">
      <!-- Logo -->
      <div class="auth-centered-logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="23 7 16 12 23 17 23 7" />
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
        </svg>
      </div>
      <h1 class="auth-form-title">Create Account</h1>
      <p class="auth-form-subtitle" style="margin-bottom: 1.5rem">
        Join SSS Vilage Elementary School's monitoring system
      </p>

      <div class="auth-form-card">
        <form id="register-form" class="space-y-4" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="firstName">First Name</label>
              <input
                class="form-input"
                type="text"
                id="firstName"
                name="firstName"
                placeholder="John"
                autocomplete="given-name"
              />
              <p class="field-error" id="firstName-error">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="10" />
                  <line x1="12" y1="8" x2="12" y2="12" />
                  <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <span></span>
              </p>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last Name</label>
              <input
                class="form-input"
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Doe"
                autocomplete="family-name"
              />
              <p class="field-error" id="lastName-error">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="10" />
                  <line x1="12" y1="8" x2="12" y2="12" />
                  <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <span></span>
              </p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="teacher@school.com"
              autocomplete="email"
            />
            <p class="field-error" id="email-error">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </p>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-group">
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="••••••"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="form-input-toggle"
                onclick="togglePassword()"
                aria-label="Toggle password visibility"
              >
                <svg
                  id="eye-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  id="eye-off-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                  />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                </svg>
              </button>
            </div>
            <div
              class="strength-meter"
              id="strength-meter"
              style="display: none"
            >
              <div class="strength-bar" id="bar1"></div>
              <div class="strength-bar" id="bar2"></div>
              <div class="strength-bar" id="bar3"></div>
              <div class="strength-bar" id="bar4"></div>
            </div>
            <p
              class="strength-label"
              id="strength-label"
              style="display: none"
            ></p>
            <p class="field-error" id="password-error">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </p>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword"
              >Confirm Password</label
            >
            <input
              class="form-input"
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="••••••"
              autocomplete="new-password"
            />
            <p class="field-error" id="confirmPassword-error">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span></span>
            </p>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-full"
            id="submit-btn"
            style="margin-top: 0.5rem"
          >
            <span class="btn-spinner"></span>
            Create Account
          </button>
        </form>

        <div class="auth-form-footer">
          <p>Already have an account? <a href="/login">Sign In</a></p>
        </div>
      </div>
    </div>

    <script>
      // ─── Toast ───
      let toastTimer;
      function showToast(message, type) {
        const toast = document.getElementById("toast");
        const msg = document.getElementById("toast-msg");
        const errIcon = document.getElementById("toast-icon-error");
        const okIcon = document.getElementById("toast-icon-success");

        clearTimeout(toastTimer);
        toast.classList.remove("show", "toast-error", "toast-success");

        msg.textContent = message;
        toast.classList.add("toast-" + type);
        errIcon.style.display = type === "error" ? "block" : "none";
        okIcon.style.display = type === "success" ? "block" : "none";

        requestAnimationFrame(() => toast.classList.add("show"));
        toastTimer = setTimeout(() => toast.classList.remove("show"), 4500);
      }

      // ─── Field-level errors ───
      function clearErrors() {
        document
          .querySelectorAll(".field-error")
          .forEach((el) => el.classList.remove("show"));
        document
          .querySelectorAll(".form-input")
          .forEach((el) => el.classList.remove("input-error"));
      }

      function showFieldError(fieldId, message) {
        const errEl = document.getElementById(fieldId + "-error");
        const input = document.getElementById(fieldId);
        if (errEl) {
          errEl.querySelector("span").textContent = message;
          errEl.classList.add("show");
        }
        if (input) input.classList.add("input-error");
      }

      // clear error on input
      document.querySelectorAll(".form-input").forEach((input) => {
        input.addEventListener("input", () => {
          input.classList.remove("input-error");
          const err = document.getElementById(input.id + "-error");
          if (err) err.classList.remove("show");
        });
      });

      // ─── Password strength meter ───
      const STRENGTH_LEVELS = [
        { label: "Too short", color: "#ef4444" },
        { label: "Weak", color: "#f97316" },
        { label: "Fair", color: "#eab308" },
        { label: "Strong", color: "#22c55e" },
        { label: "Very strong", color: "#16a34a" },
      ];
      function calcStrength(pwd) {
        if (pwd.length < 6) return 0;
        let score = 1;
        if (pwd.length >= 10) score++;
        if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
        if (/\d/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;
        return Math.min(score, 4);
      }
      const bars = [1, 2, 3, 4].map((i) => document.getElementById("bar" + i));
      document
        .getElementById("password")
        .addEventListener("input", function () {
          const val = this.value;
          const meter = document.getElementById("strength-meter");
          const label = document.getElementById("strength-label");
          if (!val) {
            meter.style.display = "none";
            label.style.display = "none";
            return;
          }
          meter.style.display = "flex";
          label.style.display = "block";
          const strength = calcStrength(val);
          const info = STRENGTH_LEVELS[strength];
          bars.forEach((b, i) => {
            b.style.background =
              i < strength ? info.color : "var(--border, #e5e7eb)";
          });
          label.textContent = info.label;
          label.style.color = info.color;
        });

      // ─── Password toggle ───
      function togglePassword() {
        const pwd = document.getElementById("password");
        const confirm = document.getElementById("confirmPassword");
        const eyeIcon = document.getElementById("eye-icon");
        const eyeOffIcon = document.getElementById("eye-off-icon");
        const newType = pwd.type === "password" ? "text" : "password";
        pwd.type = newType;
        confirm.type = newType;
        eyeIcon.style.display = newType === "password" ? "block" : "none";
        eyeOffIcon.style.display = newType === "password" ? "none" : "block";
      }

      // ─── Form submission (AJAX) ───
      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          clearErrors();

          const firstName = document.getElementById("firstName").value.trim();
          const lastName = document.getElementById("lastName").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirmPassword").value;
          let hasErr = false;

          // Client-side validation
          if (!firstName) {
            showFieldError("firstName", "First name is required.");
            hasErr = true;
          }
          if (!lastName) {
            showFieldError("lastName", "Last name is required.");
            hasErr = true;
          }
          if (!email) {
            showFieldError("email", "Email is required.");
            hasErr = true;
          } else if (!email.includes("@")) {
            showFieldError("email", "Please enter a valid email.");
            hasErr = true;
          }
          if (!password) {
            showFieldError("password", "Password is required.");
            hasErr = true;
          } else if (password.length < 6) {
            showFieldError(
              "password",
              "Password must be at least 6 characters.",
            );
            hasErr = true;
          }
          if (password && password !== confirm) {
            showFieldError("confirmPassword", "Passwords do not match.");
            hasErr = true;
          } else if (!confirm) {
            showFieldError("confirmPassword", "Please confirm your password.");
            hasErr = true;
          }

          if (hasErr) {
            showToast("Please fix the errors below.", "error");
            return;
          }

          const btn = document.getElementById("submit-btn");
          btn.classList.add("btn-loading");

          try {
            const formData = new FormData(e.target);
            const res = await fetch("/register", {
              method: "POST",
              headers: { "X-Requested-With": "XMLHttpRequest" },
              body: formData,
            });
            const data = await res.json();

            if (data.success) {
              showToast(
                "Account created! Redirecting to sign in...",
                "success",
              );
              setTimeout(() => (window.location.href = data.redirect), 1000);
              return;
            }

            // Server errors (per-field)
            if (data.errors) {
              for (const [field, msg] of Object.entries(data.errors)) {
                showFieldError(field, msg);
              }
              // Show first error as toast
              const firstMsg = Object.values(data.errors)[0];
              showToast(firstMsg, "error");
            }
          } catch (err) {
            showToast("Something went wrong. Please try again.", "error");
          } finally {
            btn.classList.remove("btn-loading");
          }
        });
    </script>
  </body>
</html>
