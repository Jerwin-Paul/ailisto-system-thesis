<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Ai-Listo{% endblock %}</title>
  <meta name="description" content="Ai-Listo: AI-powered student attention monitoring system." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/design.css') }}" />
  <style>
    /* SPA transition */
    .main-content .animate-in {
      transition: opacity 80ms ease, transform 80ms ease;
    }
    .main-content .animate-in.fade-out {
      opacity: 0;
      transform: translateY(4px);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </div>
          <h1>Ai-Listo</h1>
        </div>
        <p class="sidebar-subtitle">SSS Vilage Elementary School</p>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}" data-spa>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/live-session" class="{% if request.path == '/live-session' %}active{% endif %}" data-spa>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Live Session
        </a>
        <a href="/classes" class="{% if request.path == '/classes' %}active{% endif %}" data-spa>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Classes
        </a>
        <a href="/history" class="{% if request.path == '/history' %}active{% endif %}" data-spa>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </a>
        <a href="/reports" class="{% if request.path == '/reports' %}active{% endif %}" data-spa>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Reports
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="/profile" class="sidebar-user" data-spa style="text-decoration:none; border-radius: var(--radius-xl); transition: background 0.2s; {% if request.path == '/profile' %}background: var(--primary-light);{% endif %}">
          <div class="sidebar-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name">{{ user.first_name }} {{ user.last_name }}</p>
            <p class="sidebar-user-role">{{ user.role }}</p>
          </div>
        </a>
        <a href="/logout" class="btn btn-signout">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="animate-in" id="page-content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  {% block scripts %}{% endblock %}

  <!-- SPA-like navigation -->
  <script data-spa-router>
  if (!window.__spaRouterInit) {
    window.__spaRouterInit = true;

    const contentEl = document.getElementById('page-content');
    const cache = {};

    // Eagerly prefetch ALL sidebar pages on load
    document.querySelectorAll('[data-spa]').forEach(link => {
      const href = link.getAttribute('href');
      if (href && href !== '/logout' && href !== window.location.pathname) {
        cache[href] = fetch(href).then(r => r.text()).catch(() => null);
      }
    });

    document.querySelectorAll('[data-spa]').forEach(link => {
      if (link.__spaBound) return;
      link.__spaBound = true;

      link.addEventListener('click', async (e) => {
        const href = link.getAttribute('href');
        if (href === window.location.pathname) { e.preventDefault(); return; }
        if (href === '/logout') return;
        e.preventDefault();

        try {
          // Get content (already prefetched = instant, otherwise fetch now)
          const html = cache[href]
            ? await cache[href]
            : await fetch(href).then(r => r.text());

          if (!html) { window.location.href = href; return; }

          const doc = new DOMParser().parseFromString(html, 'text/html');
          const newContent = doc.getElementById('page-content');
          if (!newContent) { window.location.href = href; return; }


          // Run page cleanup before swapping (e.g. stop camera streams)
          if (typeof window.__pageCleanup === 'function') {
            window.__pageCleanup();
            window.__pageCleanup = null;
          }

          // Swap immediately
          contentEl.innerHTML = newContent.innerHTML;
          const newTitle = doc.querySelector('title');
          if (newTitle) document.title = newTitle.textContent;

          // Update sidebar active states
          document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
          const activeLink = document.querySelector(`.sidebar-nav a[href="${href}"]`);
          if (activeLink) activeLink.classList.add('active');
          const profileLink = document.querySelector('.sidebar-user');
          if (profileLink) profileLink.style.background = href === '/profile' ? 'var(--primary-light)' : '';

          history.pushState({}, '', href);

          // Run page-specific scripts
          contentEl.querySelectorAll('script').forEach(old => {
            const s = document.createElement('script');
            if (old.src) s.src = old.src;
            else s.textContent = old.textContent;
            old.parentNode.replaceChild(s, old);
          });

          // Load external head scripts if needed
          const loaded = new Set([...document.querySelectorAll('script[src]')].map(s => s.src));
          for (const s of doc.querySelectorAll('head script[src]')) {
            if (!loaded.has(s.src)) {
              await new Promise(r => { const t = document.createElement('script'); t.src = s.src; t.onload = t.onerror = r; document.head.appendChild(t); });
            }
          }

          document.querySelector('.main-content').scrollTop = 0;

          // Re-prefetch this page for next visit (fresh data)
          delete cache[href];
          cache[href] = fetch(href).then(r => r.text()).catch(() => null);

        } catch (err) {
          window.location.href = href;
        }
      });
    });

    window.addEventListener('popstate', () => window.location.reload());
  }
  </script>
</body>
</html>
